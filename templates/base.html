<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Freedom for Dance{% endblock %}</title>
  <meta name="description" content="A community for dancers who move to their own rhythm. Playlists, events, and the people who make the floor come alive.">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: "var(--bg)",
            surface: "var(--surface)",
            "surface-2": "var(--surface-2)",
            "surface-3": "var(--surface-3)",
            border: "var(--border)",
            "border-2": "var(--border-2)",
            paper: "var(--text)",
            muted: "var(--text-2)",
            accent: "var(--accent)",
            success: "var(--success)",
            warning: "var(--warning)",
            danger: "var(--danger)",
          },
          fontFamily: {
            display: "var(--font-display)",
            body: "var(--font-body)",
          },
          borderRadius: {
            card: "6px",
          },
          maxWidth: { shell: "1200px" },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  {% block head %}{% endblock %}
</head>
<body class="text-paper font-body antialiased">
  <a class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-50 focus:bg-accent focus:text-white focus:px-4 focus:py-2 focus:rounded" href="#main">Skip to content</a>

  {% block body %}{% endblock %}

  <div id="toast-region" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm" aria-live="polite" aria-atomic="true"></div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <script>window.__flashed = {{ messages | tojson }};</script>
    {% endif %}
  {% endwith %}

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script>lucide.createIcons();</script>
  {% block scripts %}{% endblock %}
</body>
</html>
