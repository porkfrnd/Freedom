# Alembic configuration. The database URL is read from the DATABASE_URL
# environment variable (see migrations/env.py) so the same config works for
# Neon Postgres and the local SQLite dev fallback.

[alembic]
script_location = migrations
prepend_sys_path = .
# sqlalchemy.url is intentionally NOT set here; migrations/env.py resolves it.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
