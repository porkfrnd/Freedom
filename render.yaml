# Render blueprint — single web service + managed Postgres.

databases:
  - name: freedom-for-dance-db
    databaseName: freedomfordance
    plan: starter
    postgresMajorVersion: "16"

services:
  - type: web
    name: freedom-for-dance
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: gunicorn -w 1 --threads 4 -k gthread app:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: freedom-for-dance-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: BASE_URL
        value: https://freedom-for-dance.onrender.com
      - key: JWT_TTL_HOURS
        value: "24"
